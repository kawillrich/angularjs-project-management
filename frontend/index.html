<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- AngularJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.5.0/angular.min.js"

    <!-- Bootstrap 3 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <script src="https://kit.fontawesome.com/0be6100f9e.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="styles.css">

<body ng-app="myApp" ng-controller="appCtrl">

        <div class="container-fluid">
            <ul class="nav navbar-nav">
                <li class="active">
                    <a href="#">
                        <i class="fa-duotone fa-solid fa-sidebar"

                    </a>
                </li>
                <li>

                    </a>
                </li>
                <li>

                            <div class="input-group">

                                </div>

    <div class="col-sm-4"></div>

    <script src="appCtrl.js"></script>
